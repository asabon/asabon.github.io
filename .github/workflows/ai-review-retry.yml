name: AI Review Retry Orchestrator

on:
  schedule:
    # 毎正時(00分)はGitHub全体の負荷集中で遅延・ドロップしやすいため、あえて中途半端な分(例: 17分)に設定
    - cron: '17 * * * *'
  workflow_dispatch: # Actions タブから手動実行可能

concurrency:
  group: ai-review-retry-orchestrator
  cancel-in-progress: false

jobs:
  retry-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run unit tests
        run: node --test .github/scripts/ai-review-retry.test.mjs

      - name: Process Skipped / Updated PRs across asabon and asabon-lab
        env:
          # asabon と asabon-lab 両方にアクセス権を持つ PAT を設定
          GH_TOKEN: ${{ secrets.ORG_REVIEW_TRIGGER_PAT }}
          COOLDOWN_MINUTES: 55
        run: node .github/scripts/ai-review-retry.mjs
